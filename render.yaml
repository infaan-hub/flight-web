# Render Blueprint for SkyTrack.
# Deploy: New + -> Blueprint -> pick this repo. Blueprint honors rootDir/buildCommand,
# so Python + Node versions are pinned here (manual Web Services ignore this file).
# Vars with `sync: false` must be entered once in the Render dashboard.
services:
  # ============ Django Backend API ============
  - type: web
    name: skytrack-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "chmod +x build.sh && ./build.sh"
    startCommand: "chmod +x start.sh && ./start.sh"
    healthCheckPath: /api/stats/
    autoDeploy: true
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "flight-web-t6ia.onrender.com"
      - key: CORS_ALLOW_ALL
        value: "False"
      # Add the frontend's onrender.com URL here (comma-separated) so its
      # browser requests pass CORS, e.g. https://skytrack-frontend.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: "https://flight-web-t6ia.onrender.com"
      - key: DATABASE_URL
        value: "postgresql://neondb_owner:npg_1Ia9ywLgpDnO@ep-divine-grass-aya27i7w-pooler.c-5.us-east-2.aws.neon.tech/neondb?sslmode=require&channel_binding=require"
      - key: AVIATIONSTACK_API_KEY
        sync: false
      - key: OPENSKY_CLIENT_ID
        sync: false
      - key: OPENSKY_CLIENT_SECRET
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.4"

  # ============ React Frontend (Static Site) ============
  - type: web
    name: skytrack-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    publishPath: dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: "https://flight-web-t6ia.onrender.com/api"
      - key: VITE_MAPBOX_TOKEN
        sync: false
